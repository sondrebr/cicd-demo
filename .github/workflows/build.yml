name: Build and test with EESSI
on: [push, pull_request]
jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - ubuntu-24.04
          - ubuntu-24.04-arm
    steps:
    - uses: actions/checkout@v4
    - uses: eessi/github-action-eessi@v3
    - name: Test EESSI
      run: |
        module load CMake HDF5 buildenv
        mkdir build
        cd build
        cmake ..
        make
        ctest --output-on-failure --verbose
      shell: bash
